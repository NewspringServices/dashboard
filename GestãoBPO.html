<!DOCTYPE html>
<html lang="pt">
<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">

<title>BPO</title>

<style>

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family:Arial,sans-serif;
}

body{
    background:#f4f7f6;
}

/* MENU PRINCIPAL */

.top-menu{

    width:100%;
    height:65px;

    background:linear-gradient(
        135deg,
        #2E7D32,
        #1B5E20
    );

    display:flex;
    align-items:center;

    padding:0 25px;

    box-shadow:0 3px 12px rgba(0,0,0,.15);

}

.logo{

    color:white;
    font-size:21px;
    font-weight:bold;

    margin-right:40px;

}

.menu-buttons{

    display:flex;
    gap:8px;
}

.menu-buttons button{

    background:transparent;

    border:none;

    color:white;

    padding:12px 22px;

    border-radius:8px;

    cursor:pointer;

    font-size:14px;

    font-weight:600;

}

.menu-buttons button:hover{

    background:rgba(255,255,255,.15);

}

.menu-buttons button.active{

    background:white;
    color:#2E7D32;

}

/* ÁREA DAS ABAS */

.conteudo{

    width:100%;
    height:calc(100vh - 65px);

}

/* CADA ABA */

.aba{

    display:none;

    width:100%;
    height:100%;

}

.aba.active{

    display:block;

}

/* IFRAME */

.aba iframe{

    width:100%;
    height:100%;

    border:none;

}

</style>

</head>

<body>


<!-- MENU -->

<div class="top-menu">

    <div class="logo">
        BPO
    </div>

    <div class="menu-buttons">

        <button
            id="btnMulticare"
            onclick="abrirAba('multicare')"
            class="active"
        >
            BPO Multicare
        </button>

        <button
            id="btnFidelidade"
            onclick="abrirAba('fidelidade')"
        >
            BPO Fidelidade
        </button>

    </div>

</div>


<!-- CONTEÚDO -->

<div class="conteudo">


    <!-- MULTICARE -->

    <div
        id="abaMulticare"
        class="aba active"
    >

        <div style="
            padding:40px;
            text-align:center;
        ">

            <h1>BPO Multicare</h1>

            <p style="
                margin-top:10px;
                color:#666;
            ">
                Área Multicare
            </p>

        </div>

    </div>


    <!-- FIDELIDADE -->

    <div
        id="abaFidelidade"
        class="aba"
    >

        <iframe
            src="fidelidade.html"
            title="BPO Fidelidade">
        </iframe>

    </div>


</div>


<script>

function abrirAba(aba){

    const multicare =
        document.getElementById("abaMulticare");

    const fidelidade =
        document.getElementById("abaFidelidade");

    const btnMulticare =
        document.getElementById("btnMulticare");

    const btnFidelidade =
        document.getElementById("btnFidelidade");


    /* ESCONDER TUDO */

    multicare.classList.remove("active");
    fidelidade.classList.remove("active");

    btnMulticare.classList.remove("active");
    btnFidelidade.classList.remove("active");


    /* ABRIR MULTICARE */

    if(aba === "multicare"){

        multicare.classList.add("active");
        btnMulticare.classList.add("active");

    }


    /* ABRIR FIDELIDADE */

    if(aba === "fidelidade"){

        fidelidade.classList.add("active");
        btnFidelidade.classList.add("active");

    }

}

</script>

</body>
</html>
