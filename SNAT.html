<!DOCTYPE html>
<html lang="pt">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Pedido de Férias 2026</title>
<style>
body {
    font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
    margin: 0;
    height: 100vh;
    display: flex;
    align-items: flex-start;
    justify-content: center;
    padding-top: 40px;

    /* 🔥 IMAGEM DE FUNDO */
    background-image: url("FUNDO.jpg");
    background-size: cover;
    background-repeat: no-repeat;
    background-position: center center;
    background-attachment: fixed;
    color: #0f3d2e;
}
#passwordPrompt, #formContainer {
    background-color: white;
    padding: 30px;
    border-radius: 12px;
    box-shadow: 0 4px 20px rgba(15, 61, 46, 0.2);
    max-width: 400px;
    width: 100%;
    margin-bottom: 20px;
}
label { display: block; margin-bottom: 10px; color: #0f3d2e; }
select, input[type="date"], input[type="password"] {
    padding: 8px; margin-bottom: 15px; width: 100%;
    border: 1px solid #0f3d2e; border-radius: 6px;
    background-color: #f8fdfb; color: #0f3d2e;
}
button {
    padding: 10px 15px; background-color: #0f3d2e; color: white;
    border: none; border-radius: 6px; cursor: pointer; margin-top: 10px;
}
button:hover { background-color: #0c3326; }
.error { color: #a33; margin-top: 10px; display: none; }
.success { color: green; font-weight: bold; margin-top: 15px; }
#formContainer { display: none; }
h1, h2 { text-align: center; }
#resumoPedidos div {
    border: 1px solid #0f3d2e;
    padding: 10px;
    margin-top: 10px;
    border-radius: 6px;
    background-color: #e6ffec;
}
</style>
</head>
<body>

<!-- LOGIN -->
<div id="passwordPrompt">
<h1>EQUIPA TESTE</h1>
<label for="password">Password de Acesso:</label>
<input type="password" id="password" required>
<button id="btnEntrar">Entrar</button>
<div id="senhaErro" class="error">Senha incorreta. Tente novamente.</div>
</div>

<!-- FORMULÁRIO -->
<div id="formContainer">
<h1>Equipa Sinistros AT</h1>

<form id="reservaForm">
<label for="nome">Nome:</label>
<select id="nome" required>
  <option></option>
    <option>Telma Sofia Pereira Rosa</option>
        <option>Andreia Alexandra Maltinha Gralha</option>
        <option>Rosa Maria Freire Carapinha</option>
</select>

<label for="tipoDias">Tipo de Dias:</label>
<select id="tipoDias" required>
    <option value="F26">Férias 2026</option>
    <option value="Preferenciais">2027 - Preferenciais</option>
    <option value="Não Preferenciais">2027 - Não Preferenciais</option>
</select>

<label for="dataInicio">Data de Início:</label>
<input type="date" id="dataInicio" required>

<label for="dataFim">Data de Fim:</label>
<input type="date" id="dataFim" required>

<div id="diasCalculados">Dias úteis calculados: 0</div>

<div id="errorMessages" class="error"></div>
<div id="successMessage" class="success"></div>

<button type="submit">Enviar</button>
</form>

<div id="resumoPedidos"></div>
</div>

<!-- SUPABASE SCRIPT -->
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js"></script>
<script>
const { createClient } = supabase;

const supabaseClient = createClient(
    "https://bijndfsxrzjviwrdvwms.supabase.co",
    "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImJpam5kZnN4cnpqdml3cmR2d21zIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NTA4NTA5NTIsImV4cCI6MjA2NjQyNjk1Mn0.EWaFInuqTaxvnjytb40DdnflEbBrbSYcViKLYc_kKBk"
);

const feriados = [
    "2027-01-01", // 01/01/2027 - Dia de Ano Novo
    "2027-03-26", // 26/03/2027 - Sexta-feira Santa
    "2027-03-28", // 28/03/2027 - Domingo de Páscoa
    "2027-04-25", // 25/04/2027 - Dia da Liberdade
    "2027-05-01", // 01/05/2027 - Dia do Trabalhador
    "2027-05-27", // 27/05/2027 - Corpo de Deus
    "2027-06-10", // 10/06/2027 - Dia de Portugal, de Camões e das Comunidades Portuguesas
    "2027-08-15", // 15/08/2027 - Assunção de Nossa Senhora
    "2027-10-05", // 05/10/2027 - Implantação da República
    "2027-11-01", // 01/11/2027 - Dia de Todos os Santos
    "2027-12-01", // 01/12/2027 - Restauração da Independência
    "2027-12-08", // 08/12/2027 - Dia da Imaculada Conceição
    "2027-12-25"  // 25/12/2027 - Natal
];

    

function listarConflitosFDS_FERIADOS(dataInicio,dataFim){
    let conflitos = [];
    let start = new Date(dataInicio);
    let end = new Date(dataFim);

    for(let d=new Date(start); d<=end; d.setDate(d.getDate()+1)){
        let f = d.toISOString().split("T")[0];
        let dia = d.getDay();
        if(dia===0 || dia===6 || feriados.includes(f)){
            conflitos.push(f);
        }
    }
    return conflitos;
}

function calcularDiasEntreDatas(dataInicio,dataFim){
    const start = new Date(dataInicio);
    const end = new Date(dataFim);
    let dias = 0;
    for(let d=new Date(start); d<=end; d.setDate(d.getDate()+1)){
        const f = d.toISOString().split("T")[0];
        const dia = d.getDay();
        if(dia===0 || dia===6 || feriados.includes(f)) continue;
        dias++;
    }
    return dias;
}

// Atualizar dias úteis dinamicamente
function atualizarDiasCalculados() {
    const dataInicio = document.getElementById("dataInicio").value;
    const dataFim = document.getElementById("dataFim").value;

    if(dataInicio && dataFim){
        const totalDias = calcularDiasEntreDatas(dataInicio,dataFim);
        document.getElementById("diasCalculados").innerText = `Dias úteis calculados: ${totalDias}`;
    } else {
        document.getElementById("diasCalculados").innerText = "Dias úteis calculados: 0";
    }
}

document.getElementById("dataInicio").addEventListener("change", () => {
    const dataInicio = document.getElementById("dataInicio").value;
    const campoFim = document.getElementById("dataFim");
    campoFim.min = dataInicio || "";
    if (dataInicio && campoFim.value && campoFim.value < dataInicio) {
        campoFim.value = "";
    }
    atualizarDiasCalculados();
});
document.getElementById("dataFim").addEventListener("change", atualizarDiasCalculados);

async function verificarDatasDuplicadas(nome,dataInicio,dataFim){
    const { data } = await supabaseClient
        .from("fid_SNAT")
        .select("data_inicio,data_fim")
        .eq("nome",nome);

    const inicioNovo = new Date(dataInicio);
    const fimNovo = new Date(dataFim);

    return data.filter(p=>{
        const inicio = new Date(p.data_inicio);
        const fim = new Date(p.data_fim);
        return inicioNovo <= fim && fimNovo >= inicio;
    });
}

async function verificarLimites(nome,tipoDias,diasNovo){
    const limites = {
"Telma Sofia Pereira Rosa": { "F26": 0, "Preferenciais": 10, "Não Preferenciais": 12 },
"Andreia Alexandra Maltinha Gralha": { "F26": 1, "Preferenciais": 10, "Não Preferenciais": 12 },
"Rosa Maria Freire Carapinha": { "F26": 0, "Preferenciais": 10, "Não Preferenciais": 12 }



    };

    const { data } = await supabaseClient
        .from("fid_SNAT")
        .select("total_dias,tipo_dias")
        .eq("nome",nome)
        .eq("tipo_dias",tipoDias);

    let usados = data.reduce((s,p)=>s+p.total_dias,0);
    let limite = limites[nome][tipoDias];

    if(usados + diasNovo > limite){
        return { pode:false, limiteTotal: limite };
    }
    return { pode:true };
}

// Períodos bloqueados
const bloqueios = [
    { inicio: "2027-01-01", fim: "2027-01-15" }, // Janeiro 2027 - 1.ª quinzena
    { inicio: "2027-12-01", fim: "2027-12-31" }  // Dezembro 2027 - mês completo
];

function intervaloBloqueado(d1, d2, bloqueios){
    let start = new Date(d1);
    let end = new Date(d2);

    for(let d=new Date(start); d<=end; d.setDate(d.getDate()+1)){
        let f = d.toISOString().split("T")[0];
        for(let b of bloqueios){
            if(f >= b.inicio && f <= b.fim && (!b.excecao || f !== b.excecao)){
                return true;
            }
        }
    }
    return false;
}

document.getElementById("reservaForm").addEventListener("submit", async(e)=>{
    e.preventDefault();

    const nome = document.getElementById("nome").value;
    const tipoDias = document.getElementById("tipoDias").value;
    const dataInicio = document.getElementById("dataInicio").value;
    const dataFim = document.getElementById("dataFim").value;

    if (dataInicio && dataFim && dataFim < dataInicio) {
        document.getElementById("errorMessages").innerText =
            "❌ A data de fim não pode ser anterior à data de início.";
        document.getElementById("errorMessages").style.display = "block";
        return;
    }

    if(tipoDias === "F26"){
        const limiteF26 = "2027-04-30";
        if(dataInicio > limiteF26 || dataFim > limiteF26){
            document.getElementById("errorMessages").innerText =
            "❌ Férias 2025 só podem ser marcadas até 30/04/2027.";
            document.getElementById("errorMessages").style.display="block";
            return;
        }
    }

    if(intervaloBloqueado(dataInicio, dataFim, bloqueios)){
        document.getElementById("errorMessages").innerText =
        "❌ Datas bloqueadas: 1.ª quinzena de janeiro de 2027 e todo o mês de dezembro de 2027.";
        document.getElementById("errorMessages").style.display="block";
        return;
    }

    const conflitosDatas = listarConflitosFDS_FERIADOS(dataInicio,dataFim);
    if(conflitosDatas.length > 0){
        document.getElementById("errorMessages").innerText =
        "❌ Pedido não pode conter Fins de Semana ou Feriados: " + conflitosDatas.join(", ");
        document.getElementById("errorMessages").style.display="block";
        return;
    }

    const totalDias = calcularDiasEntreDatas(dataInicio,dataFim);

    const duplicadas = await verificarDatasDuplicadas(nome,dataInicio,dataFim);
    if(duplicadas.length > 0){
        let conflitoMsg = duplicadas.map(c=>`${c.data_inicio} a ${c.data_fim}`).join(", ");
        document.getElementById("errorMessages").innerText =
        "❌ Datas em conflito: " + conflitoMsg;
        document.getElementById("errorMessages").style.display="block";
        return;
    }

    const limite = await verificarLimites(nome,tipoDias,totalDias);
    if(!limite.pode){
        let msg = "";
        let autorizados = limite.limiteTotal;

        if(tipoDias === "F26"){
            msg = `❌ ${autorizados} dias autorizados em Férias 2026.`;
        }
        else if(tipoDias === "Preferenciais"){
            msg = `❌ ${autorizados} dias autorizados em Preferenciais 2027.`;
        }
        else if(tipoDias === "Não Preferenciais"){
            msg = `❌ ${autorizados} dias autorizados em Não Preferenciais 2027.`;
        }

        document.getElementById("errorMessages").innerText = msg;
        document.getElementById("errorMessages").style.display="block";
        return;
    }

    await supabaseClient.from("fid_SNAT").insert([{
        nome,
        tipo_dias: tipoDias,
        data_inicio: dataInicio,
        data_fim: dataFim,
        total_dias: totalDias
    }]);

    document.getElementById("successMessage").innerText =
    `✔️ Pedido Registado: ${nome} (${tipoDias}) ${dataInicio} a ${dataFim} (${totalDias} dias úteis)`;
    document.getElementById("errorMessages").style.display="none";

    const div = document.createElement("div");
    div.innerHTML = `
        <strong>Pedido Registado:</strong><br>
        Nome: ${nome}<br>
        Tipo: ${tipoDias}<br>
        Data Início: ${dataInicio}<br>
        Data Fim: ${dataFim}<br>
        Dias Úteis: ${totalDias}
    `;
    document.getElementById("resumoPedidos").appendChild(div);

    e.target.reset();
    document.getElementById("diasCalculados").innerText = "Dias úteis calculados: 0";
});

document.getElementById("btnEntrar").addEventListener("click",()=>{
    if(document.getElementById("password").value === "TRosa"){
        document.getElementById("passwordPrompt").style.display="none";
        document.getElementById("formContainer").style.display="block";
    } else {
        document.getElementById("senhaErro").style.display="block";
    }
});
</script>

</body>
</html>
